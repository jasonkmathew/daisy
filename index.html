<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brawl Legends</title>
    <style>
      @font-face {
        font-family: 'Bangers';
        src: url('assets/fonts/Bangers.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'Russo One';
        src: url('assets/fonts/RussoOne.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05030d;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        background: #000;
        image-rendering: auto;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720"></canvas>

    <script src="src/core/util.js"></script>
    <script src="src/core/input.js"></script>
    <script src="src/core/audio.js"></script>
    <script src="src/game/skeleton.js"></script>
    <script src="src/game/moves.js"></script>
    <script src="src/game/characters.js"></script>
    <script src="src/game/effects.js"></script>
    <script src="src/game/stages.js"></script>
    <script src="src/game/projectiles.js"></script>
    <script src="src/game/items.js"></script>
    <script src="src/game/finals.js"></script>
    <script src="src/game/fighter.js"></script>
    <script src="src/game/ai.js"></script>
    <script src="src/game/match.js"></script>
    <script src="src/render/fighterRenderer.js"></script>
    <script src="src/render/gameRenderer.js"></script>
    <script src="src/ui/widgets.js"></script>
    <script src="src/ui/screens.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
